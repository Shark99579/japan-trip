      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 520;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);

    // State Management with Safe Fallback
    let state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let currentTab = 'itinerary';
    let db = null;
    let tripRef = null;
    let isFirebaseReady = false;
    let tempModalImgData = '';

    // Load local backup first so screen is NEVER empty
    try {
      const localSaved = localStorage.getItem(`trip_data_${roomId}`);
      if (localSaved) {
        const parsed = JSON.parse(localSaved);
        if (parsed && Array.isArray(parsed.itinerary) && parsed.itinerary.length > 0) {
          state = { ...DEFAULT_DATA, ...parsed };
        }
      }
    } catch (e) {
      console.warn("Local load skipped", e);
    }

    // Initialize Firebase if configured
    const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("請貼上");
    if (isConfigured) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        tripRef = ref(db, `trips/${roomId}`);
        isFirebaseReady = true;

        onValue(tripRef, (snapshot) => {
          const val = snapshot.val();
          if (val && Array.isArray(val.itinerary) && val.itinerary.length > 0) {
            state = {
              ...DEFAULT_DATA,
              ...val,
              tickets: Array.isArray(val.tickets) ? val.tickets : DEFAULT_DATA.tickets,
              expenses: Array.isArray(val.expenses) ? val.expenses : DEFAULT_DATA.expenses,
              checklist: Array.isArray(val.checklist) ? val.checklist : DEFAULT_DATA.checklist,
            };
            localStorage.setItem(`trip_data_${roomId}`, JSON.stringify(state));
            updateSyncBadge("☁️ 雲端已同步", "bg-matchaLight text-emerald-700 border-emerald-200");
            renderApp();
          } else {
            saveState();
            updateSyncBadge("☁️ 雲端已初始化", "bg-matchaLight text-emerald-700 border-emerald-200");
          }
        }, (error) => {
          console.error("Firebase read error:", error);
          updateSyncBadge("💾 本機模式 (權限未開)", "bg-honeyLight text-amber-700 border-amber-200");
        });
      } catch (err) {
        console.error("Firebase init failed:", err);
        updateSyncBadge("💾 本機模式", "bg-honeyLight text-amber-700 border-amber-200");
      }
    } else {
      updateSyncBadge("💾 本機模式 (未填金鑰)", "bg-honeyLight text-amber-700 border-amber-200");
    }

    function updateSyncBadge(text, classes) {
      const badge = document.getElementById('sync-badge');
      if (badge) {
        badge.textContent = text;
        badge.className = `text-[11px] font-bold px-2.5 py-1 rounded-full border shadow-stickerSm ${classes}`;
      }
    }

    function saveState() {
      localStorage.setItem(`trip_data_${roomId}`, JSON.stringify(state));
      if (isFirebaseReady && tripRef) {
        set(tripRef, state)
          .then(() => updateSyncBadge("☁️ 雲端已同步", "bg-matchaLight text-emerald-700 border-emerald-200"))
          .catch((e) => console.error("Firebase write error:", e));
      }
    }

    // Create Snowflakes
    function initSnow() {
      const container = document.getElementById('snow-container');
      const flakes = ['❄', '❅', '❆', '•'];
      for (let i = 0; i < 16; i++) {
        const el = document.createElement('div');
        el.className = 'snowflake';
        el.textContent = flakes[i % flakes.length];
        el.style.left = `${Math.random() * 100}vw`;
        el.style.fontSize = `${Math.random() * 10 + 10}px`;
        el.style.animationDuration = `${Math.random() * 8 + 7}s`;
        el.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(el);
      }
    }

      events[eventIdx] = events[targetIdx];

      const publicTotal = state.publicFundTotal !== undefined ? state.publicFundTotal : 100000;

      let allenPrivateTwd = 0;
      let mokiPrivateTwd = 0;

      state.expenses.forEach(exp => {
        const jpyVal = exp.currency === 'JPY' ? exp.amount : exp.amount / rate;
        const twdVal = exp.currency === 'TWD' ? exp.amount : exp.amount * rate;

        if (exp.pool === 'public') {
          publicSpentJpy += jpyVal;
        } else {
          if (exp.payer === '憲聰') allenPrivateTwd += twdVal;
          if (exp.payer === '紋紋') mokiPrivateTwd += twdVal;
        }
      });

      const remainingJpy = Math.max(0, publicTotal - publicSpentJpy);
      const pct = publicTotal > 0 ? Math.min(100, Math.round((remainingJpy / publicTotal) * 100)) : 0;

      const diffTwd = Math.abs(allenPrivateTwd - mokiPrivateTwd) / 2;
      let settleText = "目前兩人私人代墊完全扯平！🎉";
      if (allenPrivateTwd > mokiPrivateTwd + 1) {
        settleText = `🐰 紋紋 應給 🐻 憲聰：約 NT$ ${Math.round(diffTwd).toLocaleString()}`;
      } else if (mokiPrivateTwd > allenPrivateTwd + 1) {
        settleText = `🐻 憲聰 應給 🐰 紋紋：約 NT$ ${Math.round(diffTwd).toLocaleString()}`;
      }

      const listHtml = state.expenses.map((exp, idx) => `
        <div class="bg-white border-2 border-[#E8DFD1] rounded-2xl p-3 flex items-center justify-between gap-2 shadow-stickerSm">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">${exp.payer === '憲聰' ? '🐻' : '🐰'}</span>
            <div>
              <h4 class="font-bold text-xs text-cocoa">${exp.title}</h4>
              <div class="flex items-center gap-1.5 mt-0.5 text-[10px]">
                <span class="px-1.5 py-0.5 rounded font-bold ${exp.pool === 'public' ? 'bg-honeyLight text-amber-800' : 'bg-babyblueLight text-sky-800'}">
                  ${exp.pool === 'public' ? '🐷 公費池' : '💳 私人代墊'}
                </span>
                <span class="text-cocoaLight">${exp.payer} 支付 · ${exp.date}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="text-right">
              <div class="font-black text-sm text-cocoa">
                ${exp.currency === 'JPY' ? '¥' : 'NT$'} ${exp.amount.toLocaleString()}
              </div>
              <div class="text-[10px] text-cocoaLight">
                ≈ ${exp.currency === 'JPY' ? `NT$ ${Math.round(exp.amount * rate).toLocaleString()}` : `¥ ${Math.round(exp.amount / rate).toLocaleString()}`}
              </div>
            </div>
            <button onclick="deleteExpense(${idx})" class="text-xs text-gray-300 hover:text-rose-400 pl-1">✕</button>
          </div>
        </div>
      `).join('');

      return `
        <div class="space-y-4">
          <div class="washi-tape bg-white border-2 border-[#E8DFD1] rounded-3xl p-4 shadow-sticker">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="text-xs font-black text-amber-800 bg-honeyLight px-2.5 py-0.5 rounded-full">🐷 雙人日幣公費小豬撲滿</span>
              <button onclick="openFundSettingsModal()"
                class="text-[11px] font-bold text-sky-700 bg-babyblueLight hover:bg-sky-100 px-2.5 py-0.5 rounded-full border border-sky-200 transition active:scale-95">
                ✏️ 匯率: ${rate}
              </button>
            </div>
            <div class="flex items-baseline justify-between mt-2">
              <div>
                <div class="text-[11px] text-cocoaLight font-bold">公費剩餘現金</div>
                <div class="text-2xl font-black text-cocoa">¥ ${Math.round(remainingJpy).toLocaleString()}</div>
              </div>
              <div class="text-right">
                <button onclick="openFundSettingsModal()" class="text-[11px] text-cocoaLight hover:text-rose-500 font-bold underline decoration-dashed underline-offset-2">
                  總額：¥ ${Math.round(publicTotal).toLocaleString()} ✏️
                </button>
                <div class="text-sm font-black text-rose-500 mt-0.5">已花：¥ ${Math.round(publicSpentJpy).toLocaleString()}</div>
              </div>
            </div>
            <div class="w-full h-3 bg-paper rounded-full overflow-hidden mt-2.5 border border-[#E8DFD1]">
              <div class="h-full bg-gradient-to-r from-honey to-strawberry transition-all" style="width: ${pct}%"></div>
            </div>
            <div class="mt-3 pt-2.5 border-t border-dashed border-[#E8DFD1] text-xs font-bold text-center text-sky-800 bg-babyblueLight/60 py-1.5 rounded-xl">
              ${settleText}
            </div>
          </div>

          <div class="bg-white border-2 border-[#E8DFD1] rounded-3xl p-4 shadow-sticker">
            <h3 class="font-black text-sm text-cocoa mb-2.5">✍️ 快速記一筆</h3>
            <div class="space-y-2.5 text-xs">
              <input id="exp-title" type="text" placeholder="消費項目（例：馬喰一代燒肉、藥妝）" class="w-full px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream focus:outline-none focus:border-strawberry">
              <div class="grid grid-cols-2 gap-2">
                <input id="exp-amount" type="number" placeholder="金額" class="w-full px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream focus:outline-none focus:border-strawberry">
                <select id="exp-currency" class="w-full px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream font-bold">
                  <option value="JPY">🇯🇵 日幣 (JPY)</option>
                  <option value="TWD">🇹🇼 台幣 (TWD)</option>
                </select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <select id="exp-pool" class="w-full px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream font-bold">
                  <option value="public">🐷 從公費小豬扣款</option>
                  <option value="private">💳 私人刷卡/代墊平分</option>
                </select>
                <select id="exp-payer" class="w-full px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream font-bold">
                  <option value="憲聰">🐻 憲聰 付款</option>
                  <option value="紋紋">🐰 紋紋 付款</option>
                </select>
              </div>
              <button onclick="addExpense()" class="w-full py-2.5 rounded-xl bg-strawberry text-white font-black text-sm shadow-stickerSm active:translate-y-0.5 transition">
                ➕ 加入帳本並同步
              </button>
            </div>
          </div>

          <div class="space-y-2">
            <h3 class="font-black text-sm text-cocoa px-1">🧾 花費明細（${state.expenses.length} 筆）</h3>
            ${listHtml}
          </div>
        </div>
      `;
    }

    // Render Checklist & Souvenir View (With Image & URL on each card)
    function renderChecklist() {
      const preferredOrder = [
        "🛍️ 日本必買藥妝伴手禮",
        "🎫 重要票券與證件",
        "🧥 雪國洋蔥式穿搭",
        "🧳 行李與 3C 備忘"
      ];
      const existingGroups = [...new Set(state.checklist.map(item => item.group))];
      const groups = [
        ...preferredOrder.filter(g => existingGroups.includes(g)),
        ...existingGroups.filter(g => !preferredOrder.includes(g))
      ];
      
      const groupsHtml = groups.map(g => {
        const items = state.checklist
          .map((item, originalIdx) => ({ ...item, originalIdx }))
          .filter(item => item.group === g);

        return `
          <div class="bg-white border-2 border-[#E8DFD1] rounded-3xl p-4 shadow-sticker">
            <div class="flex items-center justify-between mb-2.5">
              <h3 class="font-black text-sm text-cocoa">${g}</h3>
              <span class="text-[10px] font-bold text-cocoaLight">點擊 ✏️ 可加圖/網址</span>
            </div>
            <div class="space-y-2.5">
              ${items.map(item => `
                <div class="p-2.5 rounded-2xl border-2 ${item.done ? 'border-emerald-200 bg-matchaLight/25' : 'border-[#F0E6D8] bg-cream/60'} transition">
                  <div class="flex items-start gap-2.5">
                    <button onclick="toggleCheck(${item.originalIdx})"
                      class="w-5 h-5 rounded-lg flex items-center justify-center text-xs font-black shrink-0 mt-0.5 transition active:scale-110 ${item.done ? 'bg-strawberry text-white' : 'border-2 border-strawberry bg-white'}">
                      ${item.done ? '✓' : ''}
                    </button>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-start justify-between gap-2">
                        <span onclick="toggleCheck(${item.originalIdx})" class="cursor-pointer text-xs font-bold leading-relaxed ${item.done ? 'line-through text-cocoaLight' : 'text-cocoa'}">${item.text}</span>
                        <div class="flex items-center gap-1 shrink-0">
                          <button onclick="openEditChecklistModal(${item.originalIdx})" title="新增/編輯圖片與網址"
                            class="text-[10px] font-bold px-1.5 py-0.5 rounded-lg bg-paper text-cocoa hover:bg-honeyLight transition">
                            ✏️
                          </button>
                          <button onclick="deleteChecklistItem(${item.originalIdx})" title="刪除"
                            class="text-xs text-gray-300 hover:text-rose-400 px-1">
                            ✕
                          </button>
                        </div>
                      </div>

                      ${(item.img || item.url) ? `
                        <div class="mt-2 flex items-center gap-2.5 flex-wrap">
                          ${item.img ? `
                            <img src="${escapeHtml(item.img)}" alt="商品圖片"
                              onclick="openLightbox('${escapeHtml(item.img)}', '${escapeHtml(item.text)}')"
                              class="w-16 h-16 rounded-xl object-cover border-2 border-white shadow-stickerSm cursor-zoom-in bg-white" />
                          ` : ''}
                          ${item.url ? `
                            <a href="${escapeHtml(normalizeUrl(item.url))}" target="_blank" rel="noopener noreferrer"
                              class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 rounded-xl bg-babyblueLight text-sky-700 border border-sky-200 hover:bg-sky-100 transition">
                              🔗 開啟參考網址
                            </a>
                          ` : ''}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <div class="bg-white border-2 border-[#E8DFD1] rounded-3xl p-4 shadow-sticker">
            <h3 class="font-black text-sm text-cocoa mb-2">➕ 新增伴手禮 / 行李清單</h3>
            <div class="flex flex-col gap-2 text-xs">
              <select id="new-check-group" class="px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream font-bold">
                <option value="🛍️ 日本必買藥妝伴手禮">🛍️ 日本必買藥妝伴手禮</option>
                <option value="🎫 重要票券與證件">🎫 重要票券與證件</option>
                <option value="🧥 雪國洋蔥式穿搭">🧥 雪國洋蔥式穿搭</option>
                <option value="🧳 行李與 3C 備忘">🧳 行李與 3C 備忘</option>
              </select>
              <div class="flex gap-2">
                <input id="new-check-input" type="text" placeholder="輸入想買的伴手禮或攜帶物品..." class="flex-1 px-3 py-2 rounded-xl border-2 border-[#E8DFD1] bg-cream focus:outline-none focus:border-strawberry">
                <button onclick="addChecklistItem()" class="px-4 py-2 rounded-xl bg-strawberry text-white font-black shadow-stickerSm">新增</button>
              </div>
            </div>
          </div>

          ${groupsHtml}
        </div>
      `;
    }

    // Master Render
    function renderApp() {
      const container = document.getElementById('app-content');
      if (!container) return;
      if (currentTab === 'itinerary') container.innerHTML = renderItinerary();
      if (currentTab === 'booking') container.innerHTML = renderBooking();
      if (currentTab === 'expense') container.innerHTML = renderExpense();
      if (currentTab === 'checklist') container.innerHTML = renderChecklist();
    }

    // Initial Boot
    initSnow();
    renderApp();
  </script>
</body>
</html>
